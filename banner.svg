<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Gabriel Saiz  Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0907"/>
      <stop offset="45%" stop-color="#120e0b"/>
      <stop offset="100%" stop-color="#1a1511"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4921f"/>
      <stop offset="45%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#ffd06a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6"/>
      <stop offset="100%" stop-color="#efe0c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f0b429" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#ffd06a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffd06a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="0.7" fill="#fff3e6" opacity="0.08"/>
      <circle cx="42" cy="58" r="0.6" fill="#fff3e6" opacity="0.06"/>
      <circle cx="96" cy="22" r="0.8" fill="#fff3e6" opacity="0.07"/>
      <circle cx="70" cy="90" r="0.5" fill="#fff3e6" opacity="0.05"/>
      <circle cx="24" cy="100" r="0.6" fill="#fff3e6" opacity="0.06"/>
      <circle cx="110" cy="70" r="0.7" fill="#fff3e6" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>
  <rect width="1200" height="420" fill="url(#grain)"/>

  <!-- ambient arcs -->
  <g opacity="0.55" fill="none" stroke="url(#gold)" stroke-width="1.2">
    <path d="M780 40 C920 90, 1040 170, 1120 300" opacity="0.45"/>
    <path d="M820 20 C980 80, 1080 170, 1160 290" opacity="0.25"/>
    <path d="M760 70 C890 120, 1000 200, 1080 320" opacity="0.2"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(72, 78)">
    <circle cx="36" cy="36" r="34" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="36" cy="36" r="22" fill="none" stroke="#fff3e6" stroke-width="1.5" opacity="0.35"/>
    <path d="M36 12 C48 22, 52 34, 36 48 C20 34, 24 22, 36 12 Z" fill="url(#gold)" opacity="0.95"/>
    <circle cx="36" cy="34" r="5.5" fill="#120e0b"/>
  </g>

  <text x="160" y="108" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" font-weight="700">GABRIEL.CODES</text>

  <text x="72" y="210" fill="url(#cream)" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Gabriel Saiz</text>

  <text x="74" y="258" fill="#cbb9a0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="0.5">Fullstack Developer · Mobile &amp; Backend en producción</text>

  <!-- accent rule -->
  <rect x="74" y="286" width="72" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#fff3e6">
    <rect x="74" y="318" width="138" height="34" rx="17" fill="#221c17" stroke="#f0b429" stroke-opacity="0.35"/>
    <text x="143" y="340" text-anchor="middle">React Native</text>

    <rect x="224" y="318" width="96" height="34" rx="17" fill="#221c17" stroke="#f0b429" stroke-opacity="0.35"/>
    <text x="272" y="340" text-anchor="middle">.NET 8</text>

    <rect x="332" y="318" width="84" height="34" rx="17" fill="#221c17" stroke="#f0b429" stroke-opacity="0.35"/>
    <text x="374" y="340" text-anchor="middle">Vue 3</text>

    <rect x="428" y="318" width="78" height="34" rx="17" fill="#221c17" stroke="#f0b429" stroke-opacity="0.35"/>
    <text x="467" y="340" text-anchor="middle">AWS</text>
  </g>

  <!-- right status card -->
  <g transform="translate(820, 150)">
    <rect width="300" height="150" rx="18" fill="#1a1511" stroke="#f0b429" stroke-opacity="0.25"/>
    <circle cx="36" cy="42" r="6" fill="#f0b429"/>
    <text x="54" y="48" fill="#fff3e6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Abierto a oportunidades</text>
    <text x="36" y="84" fill="#cbb9a0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Zaragoza · Remoto desde España</text>
    <text x="36" y="112" fill="#cbb9a0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">App Store · Google Play · Stripe</text>
    <text x="36" y="140" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="16">gabrielcodes.dev ’</text>
  </g>
</svg>
